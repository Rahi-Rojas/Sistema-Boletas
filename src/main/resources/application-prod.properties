# Perfil de producción: activar con SPRING_PROFILES_ACTIVE=prod
# Los valores que NO se sobrescriben aquí heredan de application.properties.

# No exponer SQL con datos en logs
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Sin fallback: la app debe fallar al arrancar si no se define el secret real
jwt.secret=${JWT_SECRET}

# Orígenes CORS permitidos (separados por coma), requeridos en producción
app.cors.allowed-origins=${APP_CORS_ORIGINS}

# Nombre de BD / credenciales vienen de variables de entorno (Railway, etc.)
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

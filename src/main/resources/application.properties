spring.application.name=productos
server.port=8081

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/tienda_rojas?useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:mysql}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

jwt.secret=${JWT_SECRET:dev-secret-key-min-32-characters-for-local-dev-only}

# URL base para construir las URLs públicas de imágenes subidas
app.upload.url-base=http://localhost:8081/uploads/

# Orígenes CORS permitidos (separados por coma). En producción se restringe vía profile.
app.cors.allowed-origins=*

ruta.subida.imagenes=uploads/

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
